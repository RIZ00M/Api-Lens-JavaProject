services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apilens
      POSTGRES_USER: apilens
      POSTGRES_PASSWORD: apilens
    ports:
      - "5432:5432"
    volumes:
      - apilens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apilens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/apilens
      DATABASE_USERNAME: apilens
      DATABASE_PASSWORD: apilens
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  apilens_pgdata:
