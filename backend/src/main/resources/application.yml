spring:
  application:
    name: api-lens

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/apilens}
    username: ${DATABASE_USERNAME:apilens}
    password: ${DATABASE_PASSWORD:apilens}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.apilens: INFO

# API Lens specific configuration.
apilens:
  discovery:
    standard-openapi-paths:
      - /openapi.json
      - /openapi.yaml
      - /openapi.yml
      - /swagger.json
      - /swagger.yaml
      - /swagger.yml
      - /v3/api-docs
      - /v3/api-docs.yaml
      - /v2/api-docs
  http:
    https-only: ${APILENS_HTTPS_ONLY:true}
    max-response-size-bytes: ${MAX_RESPONSE_SIZE:2097152}   # 2 MiB
    max-redirects: ${MAX_REDIRECTS:3}
    connect-timeout-ms: ${APILENS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${APILENS_READ_TIMEOUT_MS:5000}
    allowed-content-type-prefixes:
      - application/json
      - application/yaml
      - application/x-yaml
      - text/yaml
      - text/x-yaml
      - text/plain
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
